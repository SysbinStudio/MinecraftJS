name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build site
        run: |
          mkdir -p _site/dist
          cp web/index.html _site/index.html
          npx esbuild src/protocol/varint.js --bundle --platform=node --outfile=_site/dist/minecraftjs.bundle.js || \
            echo "// placeholder" > _site/dist/minecraftjs.bundle.js
          tar -czf _site/minecraftjs-latest.tar.gz --exclude=node_modules --exclude=.git --exclude=_site .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
